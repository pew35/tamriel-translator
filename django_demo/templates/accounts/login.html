{% extends "base.html" %}

{% block content %}
  <section class="panel">
    <h1>Login</h1>
    <p>Use Peggy for the owner demo, or create a new tester account.</p>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label>
        Username
        <input name="username" autocomplete="username" required>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Login</button>
    </form>
  </section>

  <section class="panel">
    <p>No account yet?</p>
    <a href="{% url 'register' %}">Create a tester account</a>
  </section>
{% endblock %}
